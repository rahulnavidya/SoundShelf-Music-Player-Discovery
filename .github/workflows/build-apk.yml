name: Build SoundShelf APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK Platform and Build Tools
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Verify project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Unit and Robolectric Tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            artifacts/SoundShelf-Connected-debug.apk

      - name: Upload SoundShelf APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundShelf-debug-apk
          path: artifacts/SoundShelf-Connected-debug.apk
          retention-days: 14
